packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Remove overrides as upstream dependencies adopt patched releases.
  # Nest platform-express: multipart parser security fixes.
  multer: ">=2.5.0 <3"
  # Express compressed request parsing: trailing-byte denial-of-service fix.
  body-parser: ">=2.4.0 <3"
  # Test tooling: HTTP client security fixes.
  undici: ">=7.30.1 <8"
  # Validation tooling also consumes Zod; keep its copy on the patched 4.x line.
  zod: "^4.6.7"
  # Bull Board optional SQL adapter: patched mysql2 parser.
  mysql2: ">=3.23.1 <4"
  # Prisma configuration dependency: use the maintained merge implementation.
  deepmerge-ts: "^8.0.0"
  # Nest Swagger pins js-yaml 5.3.0: merge-key CPU exhaustion fix.
  "@nestjs/swagger>js-yaml": ">=5.4.1 <6"
auditConfig:
  ignoreGhsas:
    # braces stack exhaustion has no patched release. It is reached only through
    # lint tooling (eslint, stylelint) on repository-controlled patterns, never in
    # a shipped image. Remove once braces publishes a fix.
    - GHSA-vfj7-8cjw-p6xm
allowBuilds:
  simple-git-hooks: true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
