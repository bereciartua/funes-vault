name: Publish Images

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release-sha:
        type: string
        required: true
      release-version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      platforms:
        description: Target platforms (choose linux/amd64 for x86 servers when ARM emulation fails)
        type: choice
        required: true
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64

concurrency:
  group: publish-images-${{ inputs.release-sha || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
          - image: web
          - image: mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release checkout and image identity
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_SHA: ${{ inputs.release-sha }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            node scripts/release/verify.mjs
            test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            test "$(git rev-parse "v${RELEASE_VERSION}^{commit}")" = "$RELEASE_SHA"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short-sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "minor=${RELEASE_VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.release-version != '' }}
            type=raw,value=${{ inputs.release-version }},enable=${{ inputs.release-version != '' }}
            type=raw,value=${{ steps.source.outputs.minor }},enable=${{ inputs.release-version != '' }}
            type=raw,value=sha-${{ steps.source.outputs.short-sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.release-version || steps.source.outputs.short-sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.image }}
          build-args: FUNES_BUILD_SHA=${{ steps.source.outputs.sha }}
          push: true
          provenance: true
          sbom: true
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record published digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          echo "Image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
