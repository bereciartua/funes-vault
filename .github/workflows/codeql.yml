name: CodeQL
on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "30 9 * * 1"
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          output: codeql-results
          # Private repositories need code scanning enabled before hosted uploads.
          upload: ${{ (!github.event.repository.private || vars.CODEQL_UPLOAD == 'true') && 'always' || 'never' }}
          upload-database: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          retention-days: 14
